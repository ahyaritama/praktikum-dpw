<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan - Mufid & Cia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display, Montserrat, Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
            hand: ['Caveat', 'cursive'],
          },
          colors: {
            brand: {
              green: '#1b5e3a',
              lightGreen: '#238b45',
              bgLight: '#faf8f5',
              cardBg: '#faf9f6',
              textDark: '#1e293b',
              textMuted: '#64748b'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Base ticket background color */
    .ticket-bg {
      background-color: #fffff3;
    }

    /* EFEK BOLONGAN SETENGAH LINGKARAN TEMBUS PANDANG (CSS MASKING) */
    .ticket-notch {
      --stub-w: 16rem;
      /* Lebar bagian kanan pada mobile (w-64) */
      --radius: 14px;
      /* Ukuran jari-jari bolongan */

      /* WebKit (Chrome, Edge, Safari, VS Code Live Preview) */
      -webkit-mask-image:
        linear-gradient(#000 0 0),
        radial-gradient(circle var(--radius) at calc(100% - var(--stub-w)) 0px, #000 99%, transparent 100%),
        radial-gradient(circle var(--radius) at calc(100% - var(--stub-w)) 100%, #000 99%, transparent 100%);
      -webkit-mask-composite: xor;

      /* Standard (Firefox & Modern Browsers) */
      mask-image:
        linear-gradient(#000 0 0),
        radial-gradient(circle var(--radius) at calc(100% - var(--stub-w)) 0px, #000 99%, transparent 100%),
        radial-gradient(circle var(--radius) at calc(100% - var(--stub-w)) 100%, #000 99%, transparent 100%);
      mask-composite: exclude;
    }

    @media (min-width: 768px) {
      .ticket-notch {
        --stub-w: 18rem;
        /* Lebar bagian kanan pada desktop (md:w-72) */
      }
    }
  </style>
</head>

<body class="font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-stone-900">

  <!-- BACKGROUND FULL SCREEN -->
  <div class="absolute inset-0 w-full h-full bg-cover bg-center"
    style="background-image: url('assets/01-bgcover.png');">
    <!-- Dark overlay pada background luar -->
    <div class="absolute inset-0 bg-black/30"></div>
  </div>

  <!-- Bottom Right Music Icon -->
  <div class="absolute bottom-4 right-6 z-20 text-white/90 cursor-pointer hover:text-white transition">
    <div
      class="w-8 h-8 bg-black/70 rounded-full flex items-center justify-center font-serif text-4xl md:text-5xl font-bold text-[#1F6B35] tracking-tight transition-transform duration-300 hover:-translate-y-0.5">
      <img src="assets/01-logomusic.png" alt="icon music" class="w-3.5 object-cover">
    </div>
  </div>

  <!-- TICKET CARD CONTAINER (Ditambahkan class ticket-notch) -->
  <div
    class="relative z-10 w-[95%] max-w-4xl bg-[#fffff3] rounded-3xl shadow-2xl ticket-bg ticket-notch flex overflow-hidden border border-stone-200/50">

    <!-- VEKTOR SPIRAL 800x800 -->
    <svg
      class="absolute -top-36 left-[62%] -translate-x-1/2 w-[420px] h-[420px] pointer-events-none opacity-20 text-[#1b5e3a] z-0 overflow-visible"
      viewBox="0 0 800 800" fill="none" stroke="currentColor">
      <circle cx="400" cy="400" r="25" stroke-width="1.2" />
      <circle cx="400" cy="400" r="50" stroke-width="1.2" />
      <circle cx="400" cy="400" r="75" stroke-width="1.2" />
      <circle cx="400" cy="400" r="100" stroke-width="1.2" />
      <circle cx="400" cy="400" r="125" stroke-width="1.2" />
      <circle cx="400" cy="400" r="150" stroke-width="1.2" />
      <circle cx="400" cy="400" r="175" stroke-width="1.2" />
      <circle cx="400" cy="400" r="200" stroke-width="1.2" />
      <circle cx="400" cy="400" r="225" stroke-width="1.2" />
      <circle cx="400" cy="400" r="250" stroke-width="1.2" />
      <circle cx="400" cy="400" r="275" stroke-width="1.2" />
      <circle cx="400" cy="400" r="300" stroke-width="1.2" />
      <circle cx="400" cy="400" r="325" stroke-width="1.2" />
      <circle cx="400" cy="400" r="350" stroke-width="1.2" />
      <circle cx="400" cy="400" r="375" stroke-width="1.2" />
    </svg>

    <!-- LEFT SECTION -->
    <div
      class="flex-1 p-6 md:p-8 flex flex-col justify-between border-r-2 border-dashed border-stone-300 relative z-10">

      <!-- Upper Info Header -->
      <div
        class="flex justify-between border-b-2 border-stone-300/80 pb-2 items-center text-[11px] font-semibold tracking-wider text-stone-500 uppercase">
        <span>BOARDING PASS</span>
        <span>VIP CLASS</span>
      </div>

      <!-- Names Section -->
      <div class="my-5">
        <div class="grid grid-cols-2 gap-4 items-center">
          <!-- Left Name -->
          <div>
            <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">DARI</p>
            <h1
              class="font-serif text-4xl md:text-5xl font-bold text-[#1F6B35] tracking-tight transition-transform duration-300 hover:-translate-y-1 cursor-default">
              Mufid</h1>
          </div>

          <!-- Right Name -->
          <div class="text-right pl-6">
            <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">TUJUAN</p>
            <h1
              class="font-serif text-4xl md:text-5xl font-bold text-[#1F6B35] tracking-tight transition-transform duration-300 hover:-translate-y-1 cursor-default">
              Cia</h1>
          </div>
        </div>

        <!-- Dashed connector with Ampersand -->
        <div class="relative flex items-center justify-between my-3">
          <div class="w-[40%] border-b-2 border-dashed border-stone-400 relative">
            <span class="absolute -left-1 -top-[3.5px] w-2 h-2 rounded-full bg-[#1F6B35]"></span>
          </div>
          <span class="font-serif italic text-2xl font-bold text-[#1F6B35] px-2">&</span>
          <div class="w-[40%] border-b-2 border-dashed border-stone-400 relative">
            <span class="absolute -right-1 -top-[3.5px] w-2 h-2 rounded-full bg-[#1F6B35]"></span>
          </div>
        </div>
      </div>

      <!-- Passenger Info -->
      <div class="mb-5">
        <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">PENUMPANG</p>
        <h2 class="font-sans text-xl font-bold text-[#1F6B35] tracking-wide">Nama Tamu</h2>
        <div class="w-full border-b border-dotted border-stone-400 mt-2"></div>
      </div>

      <!-- Details Grid (Tanggal, Gerbang, Boarding, Tujuan) -->
      <div class="grid grid-cols-2 gap-y-4 gap-x-6">
        <!-- Tanggal -->
        <div>
          <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">TANGGAL</p>
          <div class="h-8 flex items-center">
            <p class="font-mono text-sm md:text-base font-bold text-stone-700">Jum'at, 27 November 2027</p>
          </div>
        </div>

        <!-- Gerbang -->
        <div>
          <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">GERBANG</p>
          <div class="h-8 flex items-center">
            <p class="font-hand text-2xl md:text-3xl font-semibold text-[#1b5e3a] leading-none">Pelaminan</p>
          </div>
        </div>

        <!-- Boarding -->
        <div>
          <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">BOARDING</p>
          <div class="h-8 flex items-center">
            <p class="font-mono text-sm md:text-base font-bold text-stone-700">08.00 WIB</p>
          </div>
        </div>

        <!-- Tujuan -->
        <div>
          <p class="text-[10px] font-bold tracking-widest text-stone-400 uppercase mb-1">TUJUAN</p>
          <div class="h-8 flex items-center">
            <p class="font-hand text-2xl md:text-3xl font-semibold text-[#1b5e3a] leading-none">Pekanbaru, Riau</p>
          </div>
        </div>
      </div>

      <!-- Bottom Tagline -->
      <div class="mt-6 pt-4 border-t border-stone-300/80 text-center">
        <p class="text-xs text-stone-500 font-medium italic">Tunjukkan tiket ini dengan senyuman.</p>
      </div>

    </div>

    <!-- RIGHT SECTION -->
    <div
      class="w-64 md:w-72 flex-shrink-0 p-6 md:p-8 flex flex-col justify-between items-center bg-[#fffff3] text-center relative z-10">

      <!-- Header Stub -->
      <div>
        <p class="text-[10px] font-bold tracking-wider text-stone-500 uppercase">UNDANGAN </p>
        <p class="text-[10px] font-bold tracking-wider text-stone-500 uppercase">PERNIKAHAN</p>
      </div>

      <!-- Barcode Section -->
      <div>
        <img src="assets/01-barcode.png" alt="Deskripsi Gambar" class="w-45" />
      </div>

      <div>
        <p class="text-[10px] font-bold tracking-wider text-stone-500 uppercase">TI25 · 03C </p>
      </div>

      <!-- Big Monogram M & C -->
      <div>
        <h2 class="font-serif text-4xl md:text-5xl font-bold text-[#1b5e3a] tracking-wider mb-1">M & C</h2>
        <p class="font-hand text-xl mt-3 text-stone-500 italic">save the date</p>
      </div>

      <!-- Button "Buka Undangan" -->
      <div class="w-full mt-5">
        <a href="#"
          class="inline-block w-full py-3 px-4 bg-[#238b45] hover:bg-[#1b5e3a] text-white text-xs font-bold uppercase tracking-wider rounded-full shadow-md hover:shadow-lg transition duration-200 transform hover:-translate-y-0.5">
          BUKA UNDANGAN
        </a>
      </div>

    </div>

  </div>

</body>

</html>
