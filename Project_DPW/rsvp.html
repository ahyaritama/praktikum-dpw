<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP</title>
</head>
<body>
    <div class="container">
        <h1>RSVP</h1>

        <div class="form">
            <div class="name">
                <input type="text" name="name" id="name" placeholder="Nama">
            </div>
            <div class="email">
                <input type="email" name="email" id="email" placeholder="Email">
            </div>
            <div class="phone">
                <input type="tel" name="phone" id="phone" placeholder="Nomor Telfon">
            </div>
            <div class="attend">
                <select name="attendance" id="attend">
                    <option value="default">Konfirmasi Kehadiran</option>
                    <option value="present">Hadir</option>
                    <option value="represent">Diwakilkan</option>
                </select>
            </div>
            <div class="guest">
                <input type="number" name="guest" id="guest" placeholder="Jumlah Tamu">
            </div>
            <button type="submit">Kirim</button>
        </div>
    </div>
</body>
</html>
